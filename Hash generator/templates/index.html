<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="viewport" content=""width=device-width, initial-scale="1.0">
        <title>Hash Generator</title>
        <style>
            body{
                font-family: Verdana, Geneva, Tahoma, sans-serif;
                background-color: #f4f7f6;
                color: #333;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
            }

            .container{
                background-color: #fff;
                padding: 30px;
                border-radius: 8px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                width: 100%;
                max-width: 450px;
            }

            h2{
                text-align: center;
                color:#2c3e50;
            }

            .form-group{
                margin-bottom: 15px;
            }

            label{
                display:block;
                margin-bottom: 5px;
                font-weight: bold;
            }

            input[type="text"], select{
                width:100%;
                padding:10px;
                border: 1px solid #ccc;
                border-radius: 4px;
                box-sizing: border-box;
            }

            button{
                width: 100%;
                padding: 10px;
                background-color: #3498db;
                color:white;
                border: none;
                border-radius:4px;
                cursor: pointer;
                font-size: 16px;
            }

            button:hover{
                background-color: #2980b9;
            }

            .result-box{
                margin-top: 10px;
                padding:15px;
                background-color: #e8f4f8;
                border-left: 4px solid #3498db;
                word-wrap: break-word;
            }

            .match-true{
                color:#27ae60;
                font-weight:bold;
            }

            .match-false{
                color:#c0392b;
                font-weight: bold;
            }
        </style>
    </head>

    <body>
        <div class="container">
            <h2>Hash Tool</h2>
            <form method="POST" action="/">
                <div class="form-group">
                    <label for="text_input">Text to Hash</label>
                    <input type="text" id="text_input" name="text_input" value="{{original_text}}" required>
                </div>

                <div class="form-group">
                     <label for="Algorithm">Algorithm</label>
                   <select id="algorithm" name="algorithm">
                    <option value="md5">MD5</option>
                    <option value="sha256">SHA256</option>
                    </select>
                </div>

                <div class="form-group">
                     <label for="target_hash">Enter Hash to Verify (optional)</label>
                    <input type="text" id="target_hash" name="target_hash" value="{{target_hash}}" placeholder="Enter Hash to Compare">
                </div>
                <button type="submit">Process</button>
            </form>

            {%if result_hash%}
            <div class="result-box">
                <strong>Generated Hash</strong><br>
                {{result_hash}}

                {% if is_match is not none %}
                <br><br>
                <strong>Verification status</strong>
                {%if is_match %}
                <span class="match-true">MATCH FOUND</span>
                {%else%}
                <span class="match-false">MATCH NOT FOUND</span>
                {%endif%}
                {%endif%}
            </div>
            {%endif%}
        </div>
    </body>
</html>
